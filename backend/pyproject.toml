[project]
name = "tia-backend"
version = "0.1.0"
description = "Touchless Invoice Agent (TIA) Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.31",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "pandas>=2.2.2",
    "openpyxl>=3.1.5",
    "jinja2>=3.1.4",
    "weasyprint>=62.1",
    "xhtml2pdf>=0.2.15",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0.84",
    "docling>=2.0.0",
    "pypdf>=6.14.2",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.3",
    "python-multipart>=0.0.32",
    "firebase-admin>=6.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
